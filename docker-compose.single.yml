version: "3.8"

# MinIO Standalone Mode - 1 node duy nhất, dùng để so sánh với distributed mode
# Truy cập Console: http://localhost:9001

services:
  minio:
    image: minio/minio:latest
    volumes:
      - data:/data
    env_file: .env
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  data:
