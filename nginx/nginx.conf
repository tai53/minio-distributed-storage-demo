events {
    worker_connections 1024;
}

http {
    # Audit log format — ghi chi tiet moi request
    log_format audit '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'request_time=$request_time';

    access_log /var/log/nginx/access.log audit;
    error_log  /var/log/nginx/error.log warn;

    upstream minio_api {
        least_conn;
        server minio1:9000;
        server minio2:9000;
        server minio3:9000;
        server minio4:9000;
    }

    upstream minio_console {
        least_conn;
        server minio1:9001;
        server minio2:9001;
        server minio3:9001;
        server minio4:9001;
    }

    server {
        listen 9000;
        server_name localhost;

        client_max_body_size 100M;

        location / {
            proxy_pass https://minio_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # TLS den MinIO nodes (self-signed cert)
            proxy_ssl_verify off;
            proxy_ssl_trusted_certificate /etc/nginx/certs/public.crt;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
        }
    }

    server {
        listen 9001;
        server_name localhost;

        location / {
            proxy_pass https://minio_console;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_ssl_verify off;
            proxy_ssl_trusted_certificate /etc/nginx/certs/public.crt;
        }
    }
}